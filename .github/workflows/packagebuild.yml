name: package build

on:
  push:
    tags:
      - 'v*'
      - 'RC*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true  # Fetch athrill repo
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Archive package
        id: get_archive
        run: |
          git clone https://github.com/mitsut/toppers_utils.git
          perl toppers_utils/makerelease
          FILE_NAME="$(ls -1 RELEASE/ | sed -n 1p)"
          echo "FILE_NAME=${FILE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Get commit summary
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate | sed -n 2p)
          echo "PREVIOUS_TAG: $PREVIOUS_TAG"
          git log --oneline --pretty=tformat:"%h %s" "$PREVIOUS_TAG..${GITHUB_REF_NAME}" > RELEASE_NOTES.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "./RELEASE/${{ steps.get_archive.outputs.FILE_NAME }}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt \
            --draft --prerelease
